            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

    </style>
    <script>
        // Automatic image path resolver: seamlessly handles both root and  subfolders
        window.addEventListener('error', function(e) {
            if (e.target && e.target.tagName === 'IMG') {
                const src = e.target.getAttribute('src');
                if (!src) return;
                const fileName = src.split('/').pop();
                const tried = e.target.getAttribute('data-img-fallback');
                if (!tried) {
                    e.target.setAttribute('data-img-fallback', '1');
                    // If failed on ..., fallback to root filename
                    // If failed on root filename, fallback to ...
                    if (src.startsWith('')) {
                        e.target.src = fileName;
                    } else {
                        e.target.src = '' + fileName;
                    }
                }
            }
        }, true);
    </script>
